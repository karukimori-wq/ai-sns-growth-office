name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Deployed app URL for persistence verification
        required: false
        default: "https://ai-sns-growth-office.karukimori.workers.dev"
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_SNS_DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://ai-sns-growth-office.karukimori.workers.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Apply D1 schema
        run: npx wrangler@latest d1 execute "ai-sns-growth-office" --remote --file migrations/0001_ai_sns_growth_office_json_tables.sql

      - name: Generate D1 seed SQL
        run: node scripts/generate-d1-seed-sql.mjs > /tmp/ai-sns-growth-office-seed.sql

      - name: Apply D1 seed data
        run: npx wrangler@latest d1 execute "ai-sns-growth-office" --remote --file /tmp/ai-sns-growth-office-seed.sql

      - name: Build OpenNext Cloudflare worker
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

      - name: Verify deployed persistence
        run: npm run d1:verify
