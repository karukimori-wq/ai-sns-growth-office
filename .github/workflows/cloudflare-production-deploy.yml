name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Deployed app URL for persistence verification
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build OpenNext Cloudflare worker
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

      - name: Verify deployed persistence
        if: ${{ inputs.deployment_url != '' }}
        env:
          AI_SNS_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: npm run d1:verify
